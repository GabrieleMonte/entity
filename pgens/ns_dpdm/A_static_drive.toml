# RUN A -- non-rotating star + dark-photon drive.
#
# Purpose: the resonant conversion shell, on a QUIET background. With Omega ~ 0
# the star is an inert magnetized sphere holding a hydrostatic corona, so the
# only thing radiating is the conversion itself -- no current sheet to hide it.
# This is the spherical analogue of the 1D Minkowski box: the resonance is
# crossed in SPACE (omega_p falls with r) instead of swept in time.
#
# Where the resonance sits:
#   n(r)/n0   = density * exp(-(Rstar/height)(1 - Rstar/r)) = 10 exp(-5(1-1/r))
#   omega_p(r)= (1/skindepth0) sqrt(n/n0)                   = 63.2 exp(-2.5(1-1/r))
#   omega_p = omega_d = 20  =>  r_res = 1.85 Rstar          (well inside r=5)
#   emitted wavelength 2*pi/omega_d = 0.314 Rstar ~ 54 cells at r_res
#
# Drive amplitude: quiver velocity v_q = A0 / (larmor0 * omega_d).
#   A0 = 1e-2  =>  v_q = 0.01 = 0.03 * v_th,  matching the dpdm "fast" case.

[simulation]
  name    = "nsA_static_drive"
  engine  = "srpic"
  runtime = 30.0

[grid]
  resolution = [512, 256]
  extent     = [[1.0, 5.0]]

  [grid.metric]
    metric = "qspherical"     # qsph_r0 = 0 => logarithmic radial grid

  [grid.boundaries]
    fields    = [["ATMOSPHERE", "MATCH"]]
    particles = [["ATMOSPHERE", "ABSORB"]]

    [grid.boundaries.absorb]
      ds = 0.8

    [grid.boundaries.atmosphere]
      temperature = 0.1       # m0 c^2  => v_th = 0.32
      density     = 10.0      # n0
      height      = 0.2       # Rstar; ~5 cells per scale height at the surface
      species     = [1, 2]
      ds          = 4.0       # impose the profile over the whole domain

[scales]
  # skindepth0 = 0.05: d_e at the surface (n = 10 n0) is 0.0158 = 5 cells.
  # larmor0 = skindepth0 => sigma0 = 1, i.e. weakly magnetized, closest to the
  # validated Minkowski runs. r_L = 0.05 = 16 cells, so no GCA needed.
  larmor0    = 0.05
  skindepth0 = 0.05

[algorithms]
  current_filters = 2

  [algorithms.timestep]
    CFL = 0.5

[particles]
  ppc0           = 10.0
  use_weights    = true       # mandatory in spherical
  clear_interval = 100

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 1e7
    pusher   = "Vay"

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 1e7
    pusher   = "Vay"

[setup]
  Bsurf          = 1.0
  field_geometry = "dipole"
  period         = 1.0e6      # Omega = 6.3e-6 ~ 0: static star, no magnetosphere
  spinup         = 0.0
  A0             = 1.0e-2     # dark-photon drive amplitude (units of B0)
  omega_d        = 20.0       # = m_A' ; resonance at omega_p = omega_d

[diagnostics]
  interval       = 200
  log_level      = "WARNING"
  colored_stdout = false

[output]
  format = "BPFile"

  [output.fields]
    interval_time = 0.25      # 120 frames
    quantities    = ["N_1", "N_2", "E", "B", "Rho", "J"]

  [output.particles]
    enable = false

  [output.spectra]
    enable = false

  # NOTE: no [output.stats] block. Entity hard-disables stats output in
  # non-Cartesian geometry (framework/parameters/output -> parameters.cpp:254,
  # "@TODO: disabling stats for non-Cartesian"), so the CSV would get a header
  # and never a single row. Diagnostics here come from the field snapshots.
  # The drive is analytic anyway: e_ext(t) = A0 * cos(omega_d * t).
